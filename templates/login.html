{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peritus | Login</title>
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-brand">
            <div class="brand-logo">Peritus</div>
            <p class="brand-sub">Sistema de Gerenciamento de Laudos de Perícia Técnica</p>
            <div class="brand-decoration"></div>
        </div>

        <div class="login-form-box">
            <h2>Acessar o Sistema</h2>
            <p class="login-hint">Entre com suas credenciais para continuar</p>

            <div id="loginAlert" class="alert alert-error" style="display:none"></div>

            <form method="post" class="form" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                    <span class="field-error" id="emailErr"></span>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="senha" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="toggleSenha()" aria-label="Mostrar senha">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <span class="field-error"></span>
                </div>
                {% if erro %}
                <div class="alert alert-error">{{ erro }}</div>
                {% endif %}
                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    </div>

    <script>
        function toggleSenha() {
            const input = document.getElementById('senha');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            let valid = true;

            document.getElementById('emailErr').textContent = '';
            document.getElementById('senhaErr').textContent = '';

            if (!email) { document.getElementById('emailErr').textContent = 'Informe o e-mail.'; valid = false; }
            if (!senha) { document.getElementById('senhaErr').textContent = 'Informe a senha.'; valid = false; }
            if (!valid) return;

            // Simulação de login
            if (email === 'admin@peritus.com' && senha === '123456') {
                window.location.href = 'home.html';
            } else {
                const alert = document.getElementById('loginAlert');
                alert.textContent = 'E-mail ou senha incorretos.';
                alert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
